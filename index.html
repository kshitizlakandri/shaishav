<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shaishav - Inventory Manager</title>
  <base target="_top">
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

  <!-- ═══════════════════ LOADING SCREEN ═══════════════════ -->
  <div>
    <div class="screen active" id="screen-loading">
      <div class="loading-card" id="loading-card-inner">
        <div class="loading-logo">
          <img src="images/shaishav_logo.png" alt="Shaishav Logo"> Shaishav
        </div>
        <div class="loading-spinner-wrap"><div class="spinner"></div></div>
        <div class="loading-msg">Verifying your access…</div>
      </div>
    </div>
  </div>

  <!-- ═══════════════════ APP SCREEN ═══════════════════ -->
  <div class="screen" id="screen-app">
    <div id="app-shell">

      <!-- ── SIDEBAR ── -->
      <aside id="sidebar" class="hidden">
        <div class="sidebar-logo" onclick="goHome()">
          <img src="images/shaishav_logo.png" alt="Shaishav Logo">
          <span>Shaishav</span>
        </div>

        <div class="sidebar-user" id="user-chip">
          <div class="user-avatar" id="user-avatar">?</div>
          <div class="sidebar-user-info">
            <span class="user-name" id="user-name-display">User</span>
            <span class="admin-pill" id="admin-pill" style="display:none">ADMIN</span>
          </div>
        </div>

        <div class="sidebar-logout-wrap">
          <button class="sidebar-logout-btn" onclick="handleLogout()">
            <span>← Logout</span>
          </button>
        </div>

        <nav id="main-nav">
          <button onclick="showPage('home')"      id="nav-home">🏠 <span>Home</span></button>
          <button onclick="showPage('items')"     id="nav-items">📦 <span>Item Master</span></button>
          <button onclick="showPage('pr')"        id="nav-pr">📋 <span>Purchase Requisition</span></button>
          <button onclick="showPage('pl')"        id="nav-pl">🧾 <span>Purchase Order</span></button>
          <button onclick="showPage('mr')"        id="nav-mr">📥 <span>Material Receipt</span></button>
          <button onclick="showPage('indent')"    id="nav-indent">📤 <span>Indent</span></button>
          <button onclick="goToReportsPage()"    id="nav-reports">📊 <span>Reports</span></button>
        </nav>

        <div class="sidebar-ext-link" id="ext-link-wrap" style="display:none;">
          <a id="ext-link-anchor" href="#" target="_blank">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            <span id="ext-link-label">External</span>
          </a>
        </div>
      </aside>

      <!-- ── CONTENT AREA ── -->
      <div id="content-area">
        <!-- Page partials from /pages are injected here by js/app.js -->
        <main id="page-container"></main>
      </div>
    </div>
  </div>

  <!-- ── MODALS ── -->
  <div class="modal-overlay" id="approve-modal">
    <div class="modal">
      <div class="modal-title">✅ Approve PR</div>
      <div class="modal-desc" id="approve-modal-desc">Approve this purchase requisition?</div>
      <div class="modal-actions">
        <button class="btn" style="background:var(--bg); color:var(--ink2);" onclick="closeModal('approve-modal')">Cancel</button>
        <button class="btn btn-success" onclick="doApprove()">Approve</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="reject-modal">
    <div class="modal">
      <div class="modal-title">❌ Reject PR</div>
      <div class="modal-desc" id="reject-modal-desc">Provide a reason for rejection.</div>
      <div class="modal-field">
        <label style="font-size:.7rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink3);">Reason *</label>
        <input type="text" id="reject-reason" placeholder="e.g. Out of budget" />
      </div>
      <div class="modal-actions">
        <button class="btn" style="background:var(--bg); color:var(--ink2);" onclick="closeModal('reject-modal')">Cancel</button>
        <button class="btn btn-danger" onclick="doReject()">Reject</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="confirm-modal">
    <div class="modal">
      <div class="modal-title" id="confirm-title">Are you sure?</div>
      <div class="modal-desc" id="confirm-desc">This action cannot be undone.</div>
      <div class="modal-actions">
        <button class="btn" style="background:var(--bg); color:var(--ink2);" onclick="closeModal('confirm-modal')">Cancel</button>
        <button class="btn btn-danger" id="confirm-ok-btn" onclick="confirmOk()">Delete</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Order matters only for top-level state; functions are called later at runtime -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/combobox.js"></script>
  <script src="js/items.js"></script>
  <script src="js/pr.js"></script>
  <script src="js/pl.js"></script>
  <script src="js/mr.js"></script>
  <script src="js/indent.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
